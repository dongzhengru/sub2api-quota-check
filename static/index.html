<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sub2API · 额度概览</title>
<style>
:root{color-scheme:light;--ink:#202d28;--muted:#7b867f;--line:#e3e8df}
*{box-sizing:border-box}
body{margin:0;min-height:100svh;display:grid;place-items:center;background:#f5f6f0;color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif}
main{width:100%;max-width:1000px;padding:40px 24px}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}
.card{min-width:0;background:#fff;border:1px solid var(--line);border-radius:20px;padding:32px;box-shadow:0 8px 32px #20332704}
.cardhead{display:flex;align-items:center;justify-content:space-between}
.card h2{font-size:17px;font-weight:600;margin:0}
.metric{display:flex;align-items:baseline;margin-top:34px;gap:4px}
.number{font-size:76px;letter-spacing:-4px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
.percent{font-size:26px;color:var(--muted);margin-left:4px}
.label{color:var(--muted);font-size:12px;margin:10px 0 26px}
.bar{height:8px;border-radius:20px;background:#edf0e9;overflow:hidden}
.fill{width:0;height:100%;border-radius:20px;background:#4e8767;transition:width .7s}
.seven .fill{background:#8c9e70}
.legend{display:flex;justify-content:space-between;gap:12px;font-size:12px;margin:13px 0 28px;color:var(--muted)}
.legend b{font-weight:500;color:var(--ink)}
.reset{border-top:1px solid var(--line);padding-top:22px;display:flex;justify-content:space-between;gap:12px;font-size:12px}
.reset span{color:var(--muted);white-space:nowrap}
.reset time{text-align:right;font-variant-numeric:tabular-nums}
.countdown{font-size:11px;color:var(--muted);text-align:right;margin-top:9px;line-height:1.6}
.error{color:#9a4a35;font-size:12px;line-height:1.7;margin:20px 0 0;overflow-wrap:anywhere}
[hidden]{display:none!important}
@media(max-width:660px){main{max-width:460px;padding:24px 16px}.cards{grid-template-columns:1fr;gap:16px}.card{padding:26px}.number{font-size:64px}.metric{margin-top:26px}}
@media(prefers-reduced-motion:reduce){.fill{transition:none}}
</style>
</head>
<body>
<main aria-label="额度概览">
<div class="cards">
<section class="card" id="five_hour"><div class="cardhead"><h2>5 小时额度</h2></div><div class="metric"><span class="number">—</span><span class="percent">%</span></div><div class="label">当前剩余额度</div><div class="bar" role="progressbar" aria-label="5 小时已使用额度" aria-valuemin="0" aria-valuemax="100"><div class="fill"></div></div><div class="legend"><span>已使用 <b class="used">—</b></span><span>剩余 <b class="remaining">—</b></span></div><div class="reset"><span>下次重置</span><time>等待查询</time></div><div class="countdown">—</div><p class="error" role="alert" hidden></p></section>
<section class="card seven" id="seven_day"><div class="cardhead"><h2>7 天额度</h2></div><div class="metric"><span class="number">—</span><span class="percent">%</span></div><div class="label">当前剩余额度</div><div class="bar" role="progressbar" aria-label="7 天已使用额度" aria-valuemin="0" aria-valuemax="100"><div class="fill"></div></div><div class="legend"><span>已使用 <b class="used">—</b></span><span>剩余 <b class="remaining">—</b></span></div><div class="reset"><span>下次重置</span><time>等待查询</time></div><div class="countdown">—</div><p class="error" role="alert" hidden></p></section>
</div>
</main>
<script>
let latest=null, busy=false;
const fmt=n=>Number(n.toFixed(2)).toString();
function tick(){
 if(!latest)return;
 for(const key of ['five_hour','seven_day']){
  const seconds=Math.max(0,Math.ceil((Date.parse(latest[key].resets_at)-Date.now())/1000));
  const days=Math.floor(seconds/86400),hours=Math.floor(seconds%86400/3600),minutes=Math.floor(seconds%3600/60);
  document.querySelector('#'+key+' .countdown').textContent=seconds?`距重置 ${days?days+' 天 ':''}${hours} 小时 ${minutes} 分钟`:'已到重置时间，等待上游更新';
 }
}
async function load(){
 if(busy)return;busy=true;
 try{
  const response=await fetch('/api/usage',{cache:'no-store'});const data=await response.json();
  if(!response.ok)throw Error(typeof data.detail==='string'?data.detail:'查询失败，请稍后重试');
  const dateFmt=new Intl.DateTimeFormat('zh-CN',{timeZone:data.timezone,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});
  for(const key of ['five_hour','seven_day']){
   const card=document.getElementById(key),w=data[key];
   card.querySelector('.number').textContent=fmt(w.remaining_percent);
   card.querySelector('.used').textContent=fmt(w.used_percent)+'%';
   card.querySelector('.remaining').textContent=fmt(w.remaining_percent)+'%';
   card.querySelector('.fill').style.width=Math.min(100,w.used_percent)+'%';
   card.querySelector('.bar').setAttribute('aria-valuenow',Math.min(100,w.used_percent));
   card.querySelector('time').textContent=dateFmt.format(new Date(w.resets_at));
   card.querySelector('time').dateTime=w.resets_at;
  }
  latest=data;
  document.querySelectorAll('.error').forEach(el=>{el.hidden=true;el.textContent='';});
  tick();
 }catch(error){
  document.querySelectorAll('.error').forEach(el=>{
   el.textContent=(latest?'更新失败，当前为上次查询数据。':'')+error.message;
   el.hidden=false;
  });
 }finally{busy=false;}
}
load();setInterval(load,60000);setInterval(tick,1000);
</script>
</body></html>
