<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sub2API · 额度概览</title>
<style>
:root{color-scheme:light;--ink:#202d28;--muted:#7b867f;--line:#e3e8df}
*{box-sizing:border-box}
body{margin:0;min-height:100svh;display:grid;place-items:center;background:#f5f6f0;color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif}
main{width:100%;max-width:1000px;padding:40px 24px}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}
.card{min-width:0;background:#fff;border:1px solid var(--line);border-radius:20px;padding:32px;box-shadow:0 8px 32px #20332704}
.cardhead{display:flex;align-items:center;justify-content:space-between}
.card h2{font-size:17px;font-weight:600;margin:0}
.metric{display:flex;align-items:baseline;margin-top:34px;gap:4px}
.number{font-size:76px;letter-spacing:-4px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
.percent{font-size:26px;color:var(--muted);margin-left:4px}
.label{color:var(--muted);font-size:12px;margin:10px 0 26px}
.bar{height:8px;border-radius:20px;background:#edf0e9;overflow:hidden}
.fill{width:0;height:100%;border-radius:20px;background:#4e8767;transition:width .7s}
.seven .fill{background:#8c9e70}
.legend{display:flex;justify-content:space-between;gap:12px;font-size:12px;margin:13px 0 28px;color:var(--muted)}
.legend b{font-weight:500;color:var(--ink)}
.reset{border-top:1px solid var(--line);padding-top:22px;display:flex;justify-content:space-between;gap:12px;font-size:12px}
.reset span{color:var(--muted);white-space:nowrap}
.reset time{text-align:right;font-variant-numeric:tabular-nums}
.countdown{font-size:11px;color:var(--muted);text-align:right;margin-top:9px;line-height:1.6}
.error{color:#9a4a35;font-size:12px;line-height:1.7;margin:20px 0 0;overflow-wrap:anywhere}
[hidden]{display:none!important}
.breakdown{margin-top:24px;padding:28px}
.credits{margin-top:24px;padding:24px 28px}.credit-list{display:grid;gap:14px;margin-top:18px}.credit-row{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;font-size:13px}.credit-row small{display:block;margin-top:5px;color:var(--muted);font-size:12px}.credit-row .expiry{text-align:right}.credit-warning{color:#9a4a35!important}
.account-summary{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:24px}.summary-item{padding:20px 24px}.summary-value{font-size:28px;font-weight:600;font-variant-numeric:tabular-nums;margin-top:12px}.summary-label{font-size:12px;color:var(--muted)}.summary-detail{font-size:12px;color:var(--muted);margin-top:6px;white-space:pre-line}.summary-detail.expiry{color:var(--ink)}
.filters,.dates,.pagination{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.filters{margin:22px 0 12px}.dates{margin-bottom:18px}
button,input,select{font:inherit;font-size:13px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);padding:8px 12px}
button{cursor:pointer}button.active{background:#4e8767;color:#fff;border-color:#4e8767}button:disabled{opacity:.45;cursor:default}
.dates label,.pagination,.status{font-size:12px;color:var(--muted)}
.tablewrap{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:13px;white-space:nowrap;font-variant-numeric:tabular-nums}th,td{padding:14px 12px;border-bottom:1px solid var(--line);text-align:right}th{font-weight:500;color:var(--muted)}th:first-child,td:first-child{text-align:left}td small{display:block;color:var(--muted);margin-top:4px}.pagination{justify-content:flex-end;margin-top:18px}.status{margin:12px 0;line-height:1.7}
@media(max-width:660px){main{max-width:460px;padding:24px 16px}.cards{grid-template-columns:1fr;gap:16px}.card{padding:26px}.number{font-size:64px}.metric{margin-top:26px}}
@media(prefers-reduced-motion:reduce){.fill{transition:none}}
</style>
</head>
<body>
<main aria-label="额度概览">
<div class="cards">
<section class="card" id="five_hour"><div class="cardhead"><h2>5 小时额度</h2></div><div class="metric"><span class="number">—</span><span class="percent">%</span></div><div class="label">当前剩余额度</div><div class="bar" role="progressbar" aria-label="5 小时已使用额度" aria-valuemin="0" aria-valuemax="100"><div class="fill"></div></div><div class="legend"><span>已使用 <b class="used">—</b></span><span>剩余 <b class="remaining">—</b></span></div><div class="reset"><span>下次重置</span><time>等待查询</time></div><div class="countdown">—</div><p class="error" role="alert" hidden></p></section>
<section class="card seven" id="seven_day"><div class="cardhead"><h2>7 天额度</h2></div><div class="metric"><span class="number">—</span><span class="percent">%</span></div><div class="label">当前剩余额度</div><div class="bar" role="progressbar" aria-label="7 天已使用额度" aria-valuemin="0" aria-valuemax="100"><div class="fill"></div></div><div class="legend"><span>已使用 <b class="used">—</b></span><span>剩余 <b class="remaining">—</b></span></div><div class="reset"><span>下次重置</span><time>等待查询</time></div><div class="countdown">—</div><p class="error" role="alert" hidden></p></section>
</div>
<div class="account-summary"><section class="card summary-item"><div class="summary-label">重置卡</div><div class="summary-value" id="reset-card-count">—</div><div class="summary-detail expiry" id="reset-card-expiry">等待查询</div></section><section class="card summary-item"><div class="summary-label">点数余额</div><div class="summary-value" id="credit-balance">—</div><div class="summary-detail">Credits</div></section></div>
<section class="card breakdown" aria-labelledby="breakdown-title">
<div class="cardhead"><h2 id="breakdown-title">用户 Token 用量</h2><span class="status" id="stats-zone"></span></div>
<div class="filters" aria-label="快捷日期"><button type="button" data-days="1" class="active" aria-pressed="true">1 天</button><button type="button" data-days="3" aria-pressed="false">3 天</button><button type="button" data-days="7" aria-pressed="false">7 天</button></div>
<form id="stats-form" class="dates"><label>开始日期 <input type="date" id="start-date" required></label><label>结束日期 <input type="date" id="end-date" required></label><button type="submit">查询</button></form>
<p id="stats-error" class="error" role="alert" hidden></p>
<p id="stats-status" class="status" role="status" aria-live="polite">等待查询</p>
<div class="tablewrap" id="stats-table"><table><thead><tr><th scope="col">用户</th><th scope="col">请求数</th><th scope="col">输入 Token</th><th scope="col">输出 Token</th><th scope="col">缓存 Token</th><th scope="col">总 Token ↓</th><th scope="col" title="cost">费用 ($)</th></tr></thead><tbody id="stats-body"></tbody></table></div>
<div class="pagination"><label>每页 <select id="page-size"><option value="20">20 条</option><option value="50">50 条</option><option value="100">100 条</option></select></label><button type="button" id="prev-page" disabled>上一页</button><span id="page-label">第 1 页</span><button type="button" id="next-page" disabled>下一页</button></div>
</section>
</main>
<script>
let latest=null, busy=false;
const apiPrefix=location.pathname.startsWith('/api/quota')?'/api/quota':'';
const fmt=n=>Number(n.toFixed(2)).toString();
function renderCredits(data){
 const info=data.reset_credits||{},count=document.getElementById('reset-card-count'),expiryLabel=document.getElementById('reset-card-expiry');
 count.textContent=Number.isFinite(info.available_count)?String(info.available_count):'—';
 count.textContent=Number.isFinite(info.available_count)?info.available_count.toLocaleString('zh-CN'):'—';
 const dates=(info.credits||[]).map(c=>c.expires_at).filter(Boolean).sort((a,b)=>Date.parse(a)-Date.parse(b));
 const dateFmt=new Intl.DateTimeFormat('zh-CN',{timeZone:data.timezone,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});
 const shortDate=value=>{const p=Object.fromEntries(new Intl.DateTimeFormat('en-US',{timeZone:data.timezone,month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'}).formatToParts(new Date(value)).map(x=>[x.type,x.value]));return `${p.month}/${p.day} ${p.hour}:${p.minute}:${p.second}`;};
 const first=dates[0]; expiryLabel.textContent=first?shortDate(first):'暂无过期时间';
 expiryLabel.title=dates.length?`所有重置卡到期时间：\n${dates.map((value,index)=>`${index+1}. ${dateFmt.format(new Date(value))}`).join('\n')}`:'';
 const balance=data.credits?.balance==null?NaN:Number(data.credits.balance);document.getElementById('credit-balance').textContent=data.credits?.unlimited?'无限':Number.isFinite(balance)?balance.toFixed(3):'—';
}
/* legacy credit rows are intentionally omitted; the summary is the compact layout. */
function renderCreditsLegacy(data){
 const summary=document.getElementById('credits-summary'),list=document.getElementById('credit-list'),error=document.getElementById('credits-error');
 const info=data.reset_credits;list?.replaceChildren();error&&(error.hidden=true);error&&(error.textContent='');
 if(!info||info.error){if(summary)summary.textContent='暂时无法查询';return;}
 summary&&(summary.textContent=`当前可用 ${info.available_count} 次`);
 if(!list)return;
 const dateFmt=new Intl.DateTimeFormat('zh-CN',{timeZone:data.timezone,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});
 for(const credit of info.credits){
  const row=document.createElement('div'),name=document.createElement('div'),remaining=document.createElement('small'),expiry=document.createElement('div');
  row.className='credit-row';name.textContent=credit.label||'重置卡';remaining.textContent=`剩余 ${credit.resets_left} 次`;name.append(remaining);expiry.className='expiry';
  if(credit.expires_at){
   const time=document.createElement('time'),countdown=document.createElement('small');time.dateTime=credit.expires_at;time.textContent=dateFmt.format(new Date(credit.expires_at));time.title=data.timezone;
   countdown.dataset.creditExpiry=credit.expires_at;expiry.append(time,countdown);
  }else expiry.textContent='上游未提供到期时间';
  row.append(name,expiry);list.append(row);
 }
}
function tick(){
 if(!latest)return;
 for(const el of document.querySelectorAll('[data-credit-expiry]')){
  const ms=Date.parse(el.dataset.creditExpiry)-Date.now(),days=Math.ceil(ms/86400000);
  el.textContent=ms<=0?'已到期':days<=1?'不足 1 天到期':`剩余 ${days} 天`;
  el.classList.toggle('credit-warning',ms<=3*86400000);
 }
 for(const key of ['five_hour','seven_day']){
  const seconds=Math.max(0,Math.ceil((Date.parse(latest[key].resets_at)-Date.now())/1000));
  const days=Math.floor(seconds/86400),hours=Math.floor(seconds%86400/3600),minutes=Math.floor(seconds%3600/60);
  document.querySelector('#'+key+' .countdown').textContent=seconds?`距重置 ${days?days+' 天 ':''}${hours} 小时 ${minutes} 分钟`:'已到重置时间，等待上游更新';
 }
}
async function load(){
 if(busy)return;busy=true;
 try{
  const response=await fetch(apiPrefix+'/api/'+'usage',{cache:'no-store'});const data=await response.json();
  if(!response.ok)throw Error(typeof data.detail==='string'?data.detail:'查询失败，请稍后重试');
  const dateFmt=new Intl.DateTimeFormat('zh-CN',{timeZone:data.timezone,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});
  for(const key of ['five_hour','seven_day']){
   const card=document.getElementById(key),w=data[key];
   card.querySelector('.number').textContent=fmt(w.remaining_percent);
   card.querySelector('.used').textContent=fmt(w.used_percent)+'%';
   card.querySelector('.remaining').textContent=fmt(w.remaining_percent)+'%';
   card.querySelector('.fill').style.width=Math.min(100,w.used_percent)+'%';
   card.querySelector('.bar').setAttribute('aria-valuenow',Math.min(100,w.used_percent));
   card.querySelector('time').textContent=dateFmt.format(new Date(w.resets_at));
   card.querySelector('time').dateTime=w.resets_at;
  }
  latest=data;
  renderCredits(data);
  document.querySelectorAll('.cards .error').forEach(el=>{el.hidden=true;el.textContent='';});
  tick();
 }catch(error){
  const creditError=document.getElementById('credits-error');if(creditError){creditError.textContent=(latest?'更新失败，重置卡信息为上次查询数据。':'')+error.message;creditError.hidden=false;}
  document.querySelectorAll('.cards .error').forEach(el=>{
   el.textContent=(latest?'更新失败，当前为上次查询数据。':'')+error.message;
   el.hidden=false;
  });
 }finally{busy=false;}
}
const startInput=document.getElementById('start-date'),endInput=document.getElementById('end-date');
let statsZone='Asia/Shanghai',statsPage=1,statsSize=20,statsRange=null,statsRequest=0,statsController=null;
function formatTokens(value){
 if(!Number.isFinite(value))return '—';
 // Select units after rounding so values near a boundary do not show 1,000 K.
 if(Math.abs(value)>=999995)return (value/1e6).toLocaleString('en-US',{maximumFractionDigits:2})+' M';
 if(Math.abs(value)>=1000)return (value/1e3).toLocaleString('en-US',{maximumFractionDigits:2})+' K';
 return value.toLocaleString('zh-CN');
}
function formatCost(value){
 return Number.isFinite(value)?'$'+value.toLocaleString('en-US',{minimumFractionDigits:3,maximumFractionDigits:3}):'—';
}
function setQuickRange(days){
 const parts=new Intl.DateTimeFormat('en-US',{timeZone:statsZone,year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());
 const part=t=>parts.find(p=>p.type===t).value;
 const end=`${part('year')}-${part('month')}-${part('day')}`;
 const start=new Date(end+'T00:00:00Z');start.setUTCDate(start.getUTCDate()-days+1);
 startInput.value=start.toISOString().slice(0,10);endInput.value=end;
 document.querySelectorAll('[data-days]').forEach(b=>{const active=Number(b.dataset.days)===days;b.classList.toggle('active',active);b.setAttribute('aria-pressed',String(active));});
}
function applyRange(){
 if(!startInput.value||!endInput.value||startInput.value>endInput.value){
  const error=document.getElementById('stats-error');error.textContent='请选择有效日期，开始日期不能晚于结束日期。';error.hidden=false;return;
 }
 statsRange={start_date:startInput.value,end_date:endInput.value};loadStats(1);
}
async function loadStats(page){
 if(!statsRange)return;
 const request=++statsRequest;
 if(statsController)statsController.abort();statsController=new AbortController();
 const status=document.getElementById('stats-status'),error=document.getElementById('stats-error');
 error.hidden=true;status.textContent='正在查询…';
 document.getElementById('stats-body').replaceChildren();
 document.getElementById('stats-table').setAttribute('aria-busy','true');
 document.getElementById('prev-page').disabled=true;document.getElementById('next-page').disabled=true;
 try{
  const params=new URLSearchParams({...statsRange,page,page_size:statsSize});
  const response=await fetch(apiPrefix+'/api/'+'user-breakdown?'+params,{cache:'no-store',signal:statsController.signal,headers:{Accept:'application/json'}});
  const raw=await response.text();let data;
  try{data=JSON.parse(raw);}catch(parseError){throw Error(`用户用量接口返回了无效数据（HTTP ${response.status}）：${raw.slice(0,120)}`);}
  if(!response.ok)throw Error(typeof data.detail==='string'?data.detail:'用户用量查询失败');
  if(request!==statsRequest)return;
  const body=document.getElementById('stats-body');
  for(const user of data.users){
   const row=document.createElement('tr'),identity=document.createElement('td'),id=document.createElement('small');
   identity.textContent=user.email||'未知用户';id.textContent='ID '+user.user_id;identity.append(id);row.append(identity);
   for(const key of ['requests','input_tokens','output_tokens','cache_tokens','total_tokens','cost']){
    const cell=document.createElement('td'),value=user[key];
    cell.textContent=key.endsWith('tokens')?formatTokens(value):key==='requests'?(Number.isFinite(value)?value.toLocaleString('zh-CN'):'—'):formatCost(value);
    if(Number.isFinite(value))cell.title=value.toLocaleString('en-US',{maximumFractionDigits:20});
    row.append(cell);
   }
   body.append(row);
  }
  statsPage=data.page;document.getElementById('page-label').textContent=`第 ${statsPage} 页`;
  document.getElementById('prev-page').disabled=statsPage<=1;document.getElementById('next-page').disabled=!data.has_more;
  status.textContent=`${data.start_date} 至 ${data.end_date}（含首尾日期） · ${data.users.length?'本页 '+data.users.length+' 位用户':'暂无用量记录'}`;
 }catch(e){if(request!==statsRequest)return;error.textContent=e.message;error.hidden=false;status.textContent='查询失败，请点击查询重试。';}
 finally{if(request===statsRequest)document.getElementById('stats-table').setAttribute('aria-busy','false');}
}
document.querySelectorAll('[data-days]').forEach(b=>b.addEventListener('click',()=>{setQuickRange(Number(b.dataset.days));applyRange();}));
for(const input of [startInput,endInput])input.addEventListener('input',()=>document.querySelectorAll('[data-days]').forEach(b=>{b.classList.remove('active');b.setAttribute('aria-pressed','false');}));
document.getElementById('stats-form').addEventListener('submit',e=>{e.preventDefault();applyRange();});
document.getElementById('page-size').addEventListener('change',e=>{statsSize=Number(e.target.value);loadStats(1);});
document.getElementById('prev-page').addEventListener('click',()=>loadStats(statsPage-1));
document.getElementById('next-page').addEventListener('click',()=>loadStats(statsPage+1));
(async()=>{try{const response=await fetch('/api/config',{cache:'no-store'});if(!response.ok)throw Error('无法加载时区配置');statsZone=(await response.json()).timezone;document.getElementById('stats-zone').textContent=statsZone;setQuickRange(1);applyRange();}catch(e){const error=document.getElementById('stats-error');error.textContent=e.message;error.hidden=false;}})();
load();setInterval(load,60000);setInterval(tick,1000);
</script>
</body></html>
